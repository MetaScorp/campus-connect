apply plugin: 'com.android.application'

android {
    compileSdkVersion 27

    defaultConfig {
        applicationId "com.campusconnect.sit"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"

        multiDexEnabled true

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
    supportVersion = "27.1.1"
}

dependencies {

    implementation 'com.squareup.okhttp3:okhttp:3.10.0'

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "com.android.support:support-v4:${supportVersion}"
    implementation "com.android.support:support-vector-drawable:${supportVersion}"
    implementation "com.android.support:appcompat-v7:${supportVersion}"
    implementation "com.android.support:cardview-v7:${supportVersion}"
    implementation "com.android.support:recyclerview-v7:${supportVersion}"
    implementation "com.android.support:design:${supportVersion}"
    implementation "com.android.support:palette-v7:${supportVersion}"
    implementation "com.android.support:percent:${supportVersion}"
    implementation "com.android.support:preference-v7:${supportVersion}"
    implementation "com.android.support:exifinterface:${supportVersion}"
    implementation "com.android.support:gridlayout-v7:${supportVersion}"

    implementation files('libs/android-networking-1.0.1.aar')

    implementation files('libs/materialfilepicker-1.9.1.aar')

    implementation files('libs/sublimepickerlibrary-2.1.1.aar')

    implementation 'com.github.bumptech.glide:glide:3.7.0'

    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'

    implementation 'com.android.support:multidex:1.0.3'
}